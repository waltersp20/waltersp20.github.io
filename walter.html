function revivePlayer(){

      e[i].x+=Math.cos(a)*130;

function pt(x,y,vx,vy,l,col,s,sm){if(P.length>=500)P.shift();P.push({x:x,y:y,vx:vx,vy:vy,life:l,max:l,col:col,s:s,sm:sm})}

function splat(x,y){D.push({x:x,y:y,r:7+Math.random()*9,a:Math.random()*6.28});if(D.length>60)D.shift()}
function hit(z,d){
  z.hp-=d;
  if(z.hp<=0&&!z.dead){
    z.dead=1;
    // Every newly killed zombie awards exactly one point. The !z.dead guard above
    // ensures this block can only run once for each death; resurrected skeletons
    // are reset to alive and can score again when killed.
    z.scored=true;
    score+=1;

    z.deathT=0;
    if(level==2&&z.boss){
      // Boss death starts the transition. The second 100-zombie phase waits
      // until the cutscene finishes.
      bossSpawned=2;
      bossCutscene=180;
      level2PostBossSpawned=0;
      X.push({x:z.x,y:z.y,t:0});
      for(let i=0;i<45;i++){
        const a=Math.random()*6.283,s=1+Math.random()*6;
        pt(z.x,z.y,Math.cos(a)*s,Math.sin(a)*s,25+Math.random()*25|0,Math.random()<.5?'#ff9d00':'#ffd86b',3+Math.random()*4,0);
      }
    }else if(level==2){
      if(bossSpawned===2){
        level2PostBossKills++;
        if(level2PostBossKills>=100)activateLevel3();
      }else{
        level2Kills++;
        if(level2Kills>=55&&!bossSpawned)spawnBoss();
      }
    }else if(level===3){
      level3Kills++;
      if(level3Kills>=150)activateLevel4();
    }else if(level===4){
      level4Kills++;
    }
    F.push({x:z.x,y:z.y,t:0});
    splat(z.x,z.y);
    if(score>=100&&level===1)activateLevel2();
  }
}
const ENV_PALETTES={
  1:{ground:'#2f6a2a',tile:'#347230',grassLight:'#5aa64a',grassDark:'#245a20',leaves:['#397d2e','#438c32','#2f7028','#4b9637']},

function mixColour(a,b,t){
  const A=[parseInt(a.slice(1,3),16),parseInt(a.slice(3,5),16),parseInt(a.slice(5,7),16)];
  const B=[parseInt(b.slice(1,3),16),parseInt(b.slice(3,5),16),parseInt(b.slice(5,7),16)];
  return '#'+A.map((v,i)=>Math.round(v+(B[i]-v)*t).toString(16).padStart(2,'0')).join('');
}
function envColour(key){
  const from=ENV_PALETTES[environmentFromLevel]||ENV_PALETTES[1];
  const to=ENV_PALETTES[level]||ENV_PALETTES[1];
  return mixColour(from[key],to[key],environmentBlend);
}
function envLeafColour(i){
  const from=(ENV_PALETTES[environmentFromLevel]||ENV_PALETTES[1]).leaves;
  const to=(ENV_PALETTES[level]||ENV_PALETTES[1]).leaves;
  return mixColour(from[i%from.length],to[i%to.length],environmentBlend);
}
function beginEnvironmentTransition(nextLevel){
  environmentFromLevel=level;
  level=nextLevel;
  environmentBlend=0;
  transitionFade=1;
}

function spawnLevelFruit(treeType){
  apples=[];
  pears=[];
  // Exactly three apples, each attached to a different leafy/dead tree.
  const appleTrees=O.filter(o=>o.t===treeType);
  for(const tree of appleTrees.sort(()=>Math.random()-.5).slice(0,3)){
    const a=Math.random()*6.283,r=tree.r+8+Math.random()*8;
    apples.push({x:tree.x+Math.cos(a)*r,y:tree.y+Math.sin(a)*r,got:0,tree});
  }
  // From Level 3 onward, one pear appears on a different tree.
  if(level>=3){
    const pearTrees=O.filter(o=>o.t===treeType&&!apples.some(a=>a.tree===o));
    if(pearTrees.length){
      const tree=pearTrees[Math.random()*pearTrees.length|0];
      const a=Math.random()*6.283,r=tree.r+8+Math.random()*8;
      pears.push({x:tree.x+Math.cos(a)*r,y:tree.y+Math.sin(a)*r,got:0,tree});
    }
  }
}

}

function activateLevel4(){
  wallCharges+=5;
  beginEnvironmentTransition(4);
  levelBanner=240;
  // Any remaining living zombies and their death animations are cleared at a level change.
  e=[];b=[];R=[];X=[];BLD=[];G=[];apples=[];pears=[];WPN=[];upgrades=[];AEX=[];

  O=O.filter(o=>o.t===0).map(o=>({...o,t:3,leafFade:1}));

  }
  for(let i=0;i<500;i++)G.push({x:Math.random()*w,y:Math.random()*h,a:Math.random()*.8-.4,l:Math.random()<.7});

function col(q,r){O.forEach(o=>{const dx=q.x-o.x,dy=q.y-o.y,d=Math.hypot(dx,dy),mm=o.r+r;if(d<mm&&d>0){q.x=o.x+dx/d*mm;q.y=o.y+dy/d*mm}})}

  for(let i=0;i<300;i++)G.push({x:Math.random()*w,y:Math.random()*h,a:Math.random()*.8-.4,l:Math.random()<.4});
}
function spawnW(){
  WPN=[];
  [1,2,3].forEach(t=>{
    for(let n=0;n<300;n++){
      const x=80+Math.random()*(w-160),y=80+Math.random()*(h-160);
      if(Math.hypot(x-w/2,y-h/2)>120&&O.every(o=>Math.hypot(o.x-x,o.y-y)>o.r+45)&&WPN.every(q=>Math.hypot(q.x-x,q.y-y)>150)){WPN.push({x:x,y:y,t:t});break}
    }

}

function spawnUpgrade(){
  const owned=[];
  for(let i=0;i<6;i++){
    if(own[i]&&gunMult[i]<2)owned.push(i);
  }
  if(!owned.length)return false;

  // Later parts favour stronger guns, while still allowing the pistol to be upgraded.
  const pool=
    T<2400 ? owned.filter(i=>i<=1) :
    T<4200 ? owned.filter(i=>i<=2) :
    owned;

  const choices=pool.length?pool:owned;
  const type=choices[Math.random()*choices.length|0];
  let x,y,ok=false;

  for(let n=0;n<300;n++){
    x=70+Math.random()*(w-140);
    y=70+Math.random()*(h-140);

    if(
      Math.hypot(x-p.x,y-p.y)>170&&
      O.every(o=>Math.hypot(o.x-x,o.y-y)>o.r+35)&&
      WPN.every(o=>Math.hypot(o.x-x,o.y-y)>70)&&
      upgrades.every(o=>Math.hypot(o.x-x,o.y-y)>70)
    ){
      ok=true;
      break;
    }
  }

  if(!ok)return false;

  upgrades.push({x:x,y:y,t:type,got:0});
  return true;
}
function save(){
  if(scoreSaved||score<=0)return;
  scoreSaved=true;
  if(score>0){
    const name=(playerName||'Player').trim().slice(0,16)||'Player';
    SC.push({name:name,score:score});
    SC.sort((a,b)=>b.score-a.score);
    SC=SC.slice(0,10);
    H=SC.length?SC[0].score:0;
    try{
      localStorage.setItem('zs',JSON.stringify(SC));
      localStorage.setItem('zs_name',name);
    }catch(x){}

function wallAt(x,y,ang,make=false){
  const len=190,th=18;
  return {x:x,y:y,a:ang,len:len,th:th,hp:220,mhp:220};
}
function wallRect(q){
  const ux=Math.cos(q.a),uy=Math.sin(q.a),vx=-uy,vy=ux;
  const pts=[
    {x:q.x-ux*q.len/2-vx*q.th/2,y:q.y-uy*q.len/2-vy*q.th/2},
    {x:q.x+ux*q.len/2-vx*q.th/2,y:q.y+uy*q.len/2-vy*q.th/2},
    {x:q.x+ux*q.len/2+vx*q.th/2,y:q.y+uy*q.len/2+vy*q.th/2},
    {x:q.x-ux*q.len/2+vx*q.th/2,y:q.y-uy*q.len/2+vy*q.th/2}
  ];
  return pts;
}
function pointWallDist(x,y,q){
  const dx=x-q.x,dy=y-q.y,co=Math.cos(q.a),si=Math.sin(q.a);
  const lx=dx*co+dy*si,ly=-dx*si+dy*co;
  const cx=Math.max(-q.len/2,Math.min(q.len/2,lx)),cy=Math.max(-q.th/2,Math.min(q.th/2,ly));
  return Math.hypot(lx-cx,ly-cy);
}
function collWall(q,r){
  BLD.forEach(o=>{
    const d=pointWallDist(q.x,q.y,o);
    if(d<r){
      const a=Math.atan2(q.y-o.y,q.x-o.x),push=r-d;
      q.x+=Math.cos(a)*push;q.y+=Math.sin(a)*push;
    }
  });
}
function wallsOverlap(a,b){
  const pa=wallRect(a),pb=wallRect(b);
  // Separating-axis test: touching edges are allowed, actual overlap is not.
  for(const poly of [pa,pb]){
    for(let i=0;i<poly.length;i++){
      const p1=poly[i],p2=poly[(i+1)%poly.length];
      const ax=-(p2.y-p1.y),ay=p2.x-p1.x;
      let amin=Infinity,amax=-Infinity,bmin=Infinity,bmax=-Infinity;
      for(const v of pa){const d=v.x*ax+v.y*ay;amin=Math.min(amin,d);amax=Math.max(amax,d)}
      for(const v of pb){const d=v.x*ax+v.y*ay;bmin=Math.min(bmin,d);bmax=Math.max(bmax,d)}
      if(amax<=bmin+0.01||bmax<=amin+0.01)return false;
    }
  }
  return true;
}
function canBuild(q){
  if(wallCharges<=0)return false;
  if(Math.hypot(q.x-p.x,q.y-p.y)<35)return false;
  if(q.x<35||q.x>w-35||q.y<35||q.y>h-35)return false;
  if(O.some(o=>pointWallDist(o.x,o.y,q)<o.r+q.th/2+4))return false;
  if(BLD.some(o=>wallsOverlap(q,o)))return false;
  return true;
}

setInterval(()=>{
  if(dead||bossCutscene>0)return;
  // Hard cap on simultaneously living zombies; level-specific total spawn limits remain below.
  if(e.reduce((count,z)=>count+(!z.dead?1:0),0)>=30)return;
  if(level==1&&totalSpawned>=120)return;
  if(level===3&&level3Spawned>=160)return;
  if(level===4&&level4Spawned>=75)return;

  // Level 2: 55 regular zombies before the boss. No regular spawns while
  // the boss is alive. After the boss dies and the cutscene ends, a fresh
  // 100-zombie phase begins.
  if(level==2){
    if(bossSpawned===0 && level2Spawned>=55)return;
    if(bossSpawned===1)return;
    if(bossSpawned===2 && level2PostBossSpawned>=100)return;
  }

  const side=Math.random()*4|0;let x,y;
  if(side==0){x=-40;y=Math.random()*h}else if(side==1){x=w+40;y=Math.random()*h}
  else if(side==2){x=Math.random()*w;y=-40}else{x=Math.random()*w;y=h+40}

  const r=Math.random();
  let ty=score>=10&&r<.2?2:score>=4&&r<.5?1:0;

  // New Level 2 zombie: BRUTE. Slow, tough and strong against walls.
  if(level==2&&Math.random()<.18)ty=4;
  if(level==3&&Math.random()<.27)ty=5;
  if(level===4&&Math.random()<.42)ty=5;

  let sh=SH[Math.random()*SH.length|0],sk=SK[Math.random()*SK.length|0],
      hp=Math.max(1,Math.ceil((1+Math.floor(score/10))*(level==2?1.15:1))),

  if(ty==1){
    sh='#5a5a6a';sk='#c9d0b8';
    hp=Math.max(1,Math.ceil(1*(level==2?1.15:1)));
    sv=1.5+Math.min(1.8,score/60);
  }
  if(ty==2){
    sh='#197a2b';sk='#8eea4f';
    hp=Math.max(2,Math.ceil(2*(level==2?1.15:1)));
    sv*=.85;
  }
  if(ty==4){
    sh='#7b4b2a';sk='#c58b58';
    hp=Math.max(6,Math.ceil(6*(level==2?1.15:1)));
    sv=.52+Math.random()*.12;
  }
  if(ty==5){

    sv=1.35+Math.random()*.22;
  }
  if(level===3&&ty!==5){sh='#292d29';sk='#555d50';hp=Math.ceil(hp*1.25);sv*=1.08;}
  if(level===4){sh='#351719';sk='#8d6260';hp=Math.ceil(hp*1.35);sv*=1.08;}

  e.push({x:x,y:y,ty:ty,hp:hp,mh:hp,ar:70+Math.min(60,score),wk:Math.random()*6,sv:sv,sh:sh,sk:sk});
  totalSpawned++;

    if(bossSpawned===0)level2Spawned++;
    else if(bossSpawned===2)level2PostBossSpawned++;
  }else if(level===3){level3Spawned++;}
  else if(level===4){level4Spawned++;}
},1000);

      const row=SC[i];
      g.fillStyle=i==hl?'#ffd400':'white';
      g.textAlign='left';g.fillText((i+1)+'.',x0+12,y0+52+i*22);
      g.fillText(row?row.name:'-',x0+38,y0+52+i*22);
      g.textAlign='right';g.fillText(row?row.score:'-',x0+242,y0+52+i*22);
    }
    g.textAlign='center';g.fillStyle='#7ccf4a';g.font='bold 15px Arial';g.fillText('YOUR BEST: '+H,x0+130,y0+278);
    g.textAlign='left';
  }
  requestAnimationFrame(game);
}
game();
})();
</script>
